[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "usenami-signer"
version = "0.1.0"
description = "Python SDK for Usenami Signer — keyless exchange authentication via AWS Nitro Enclaves"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [{ name = "Usenami", email = "hello@usenami.io" }]
keywords = ["crypto", "exchange", "signer", "nitro-enclave", "hmac", "kucoin", "binance", "bybit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "httpx>=0.25.0",
]

[project.optional-dependencies]
encrypt = [
    "boto3>=1.28.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "respx>=0.21",
    # Golden-vector wire-order test packs the action exactly as the venue
    # and the enclave do (tests/test_hyperliquid_main.py).
    "msgpack>=1.0",
]

[project.scripts]
usenami-encrypt = "usenami_signer.cli.encrypt:main"

[project.urls]
Homepage = "https://usenami.io"
Repository = "https://github.com/namixai/signer"
Documentation = "https://docs.usenami.io/signer"

[tool.hatch.build.targets.wheel]
packages = ["src/usenami_signer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
