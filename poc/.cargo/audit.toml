# cargo-audit configuration — project-local (read by `cargo audit` run from poc/).
#
# WHY ignores instead of bumps: the shipped, customer-trusted artifact is the
# measured enclave (PCR0 `ff53e1fe…`), built from pinned/vendored sources. Bumping
# any crate changes the enclave binary and therefore the PCR0 — breaking the
# published attestation. So each advisory below is resolved by a REACHABILITY
# decision on the attested path, not a version bump. Full per-advisory analysis:
# _signer/OSTIF-TEE-PROJECT-FEEDBACK (private) §05.
#
# "Review-by" note: cargo-audit has NO native per-ignore expiry field (unlike
# cargo-deny), so the expiry is documented here and enforced by process — every
# ignore is re-evaluated at the next PCR0 rotation (when the vendored tree is
# re-synced anyway) and, at the latest, reviewed by 2026-10-23 (90 days).
#
# Reviewed 2026-11-04 (the 2026-10-23 date had passed with CI red on new advisories).
# The four entries below the first line still hold. New advisories, one by one:
#   - rustls 0.23.45 (RUSTSEC-2026-0346/0347/0348/0349), rustls-webpki 0.103.15
#     (RUSTSEC-2026-0382), webpki-roots 1.0.7 (RUSTSEC-2026-0381): host-side ONLY
#     (`cargo tree -i` roots: signer-gateway; `-p signer-enclave -i` matches nothing).
#     FIXED, not ignored: bumped in Cargo.lock to 0.23.46 / 0.103.16 / 1.0.10.
#     `scripts/enclave-closure-check.py` still reports the measured enclave closure
#     unchanged (134 crates), so the PCR0 does not move.
#   - quinn-proto 0.11.14 (four new ids): ignored below, same lockfile-only reason as 0185.
#   - tokio 1.52.3 (RUSTSEC-2026-0386, unsound): ignored below, the API is never called.
#   - crypto-bigint 0.5.5 (RUSTSEC-2026-0387): REACHABLE on the attested signing path
#     (k256 0.13.4 -> ecdsa / elliptic-curve -> crypto-bigint, root signer-enclave).
#     NOT ignored: CI stays red on it until the fix (crypto-bigint >= 0.7.6, a new
#     k256 / elliptic-curve line, a new PCR0). The signer is stopped since 2026-09-21,
#     so nothing signs meanwhile. Next review: that fix, or 2027-02-01.

[advisories]
ignore = [
  # RUSTSEC-2026-0185 — quinn-proto: remote memory exhaustion (unbounded out-of-order
  # stream reassembly). NOT COMPILED into any binary: quinn-proto is a lockfile-only
  # transitive of reqwest's OFF-by-default http3/quic feature (gateway pins
  # `reqwest = { default-features = false, features = ["rustls-tls","json"] }`).
  # `cargo tree -i quinn-proto` resolves to nothing. The enclave has no network
  # stack at all (vsock only). No reachable code path processes QUIC streams.
  # Review-by: 2026-10-23 / next PCR0 rotation.
  "RUSTSEC-2026-0185",

  # RUSTSEC-2025-0134 — rustls-pemfile: unmaintained (not a CVE). Host-side ONLY:
  # pulled via reqwest → signer-gateway (outbound HTTPS to venues). NOT on the
  # attested enclave path (`cargo tree -p signer-enclave -i rustls-pemfile` = empty).
  # The enclave does no TLS/PEM parsing. Review-by: 2026-10-23 / next PCR0 rotation.
  "RUSTSEC-2025-0134",

  # RUSTSEC-2021-0127 — serde_cbor: unmaintained (not a CVE). ON the attested path
  # via aws-nitro-enclaves-nsm-api (COSE attestation-doc encoding to /dev/nsm).
  # Input is the TRUSTED NSM hardware driver, not attacker-controlled data; there is
  # no untrusted-CBOR parse surface in the enclave. Bumping = changing nsm-api =
  # new PCR0; will be re-vetted at the next rotation. Review-by: 2026-10-23 / rotation.
  "RUSTSEC-2021-0127",

  # RUSTSEC-2026-0190 — anyhow: unsoundness in `Error::downcast_mut()`. On the
  # attested path (enclave depends on anyhow), BUT the unsound API is unreachable:
  # the enclave never calls `downcast`/`downcast_mut` (grep-verified across
  # enclave/src). Fix requires an anyhow bump = new PCR0. Review-by: 2026-10-23 / rotation.
  "RUSTSEC-2026-0190",

  # RUSTSEC-2026-0338 / 0339 / 0340 / 0342 — quinn-proto 0.11.14: STREAM and DATAGRAM
  # frame handling, connection-ID retirement, ACK delay. Same crate and same reason as
  # 0185 above: NOT COMPILED into any binary (`cargo tree -i quinn-proto@0.11.14`
  # has no root on 2026-11-04; reqwest's http3 stays off). Review-by: next PCR0 rotation.
  "RUSTSEC-2026-0338",
  "RUSTSEC-2026-0339",
  "RUSTSEC-2026-0340",
  "RUSTSEC-2026-0342",

  # RUSTSEC-2026-0386 — tokio 1.52.3: `AsyncFd::new` and related constructors violate
  # I/O safety (unsound, not a CVE). tokio IS on the attested path (signer-enclave) and
  # in signer-gateway / signer-client, BUT the unsound API is unreachable: no crate here
  # calls `AsyncFd` (grep over enclave/, gateway/, parent/, policy-cli/ src = 0 on
  # 2026-11-04). Fix = a tokio bump = new PCR0. Review-by: next PCR0 rotation.
  "RUSTSEC-2026-0386",
]
