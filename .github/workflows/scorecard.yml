# OpenSSF Scorecard — automated self-review of the repository's security posture
# (branch protection, CI-tests, pinned dependencies, SAST, token permissions, …).
# Results are uploaded to the code-scanning dashboard and, with publish_results,
# to the public OpenSSF API so the score is externally verifiable.
#
# This satisfies OSTIF best-practices guide §04 ("Do Self Guided Security
# Reviews → OpenSSF Security Scorecard"). The first run establishes an honest
# baseline number; we do not claim a score we have not measured.
name: scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "0 8 * * 1" # weekly, Monday 08:00 UTC
  push:
    branches: [main]

# Top-level least privilege; the analysis job elevates only what it needs.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload SARIF to code-scanning
      id-token: write        # publish_results → OpenSSF API (OIDC)
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5
      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: results.sarif
