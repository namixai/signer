# Continuous integration for the Usenami Signer core (Rust workspace under `poc/`).
#
# Scope (honest): this proves *code health* — the workspace builds, clippy passes
# (strict `-D warnings` on the editable crates; warn-only on the PCR0-frozen
# enclave crate, whose dead_code cannot be pruned without rebuilding the attested
# binary), the test suite passes, and no dependency ON THE ATTESTED PATH carries a
# reachable RustSec advisory (lockfile-only / host-side advisories are triaged and
# ignored with justification in poc/.cargo/audit.toml). It does NOT build the
# measured enclave image (the EIF) and therefore
# does NOT attest PCR0 — that is produced by `nitro-cli build-enclave` against a
# pinned Docker build, which GitHub-hosted runners cannot reproduce bit-for-bit.
# Attestation integrity is proven separately by the reproducible-build pins and
# the published PCR0 (see docs/VERIFY-SIGNER-YOURSELF.md), not by this workflow.
# What this workflow DOES guard (2026-08-20): the enclave's dependency closure in
# Cargo.lock — a PCR0 input — must match the snapshot the published number was
# measured against (`enclave-closure-check`). A bump that touches the enclave
# fails here until the image is re-measured and the snapshot + README updated.
#
# All third-party actions are pinned by full commit SHA (OpenSSF Scorecard
# "Pinned-Dependencies"); the version tag is kept in a trailing comment and is
# what Dependabot bumps.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly re-run so a newly-published RustSec advisory turns the audit job red
    # even with no code change. Monday 07:00 UTC.
    - cron: "0 7 * * 1"

permissions:
  contents: read

defaults:
  run:
    working-directory: poc

jobs:
  build-test-clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # don't leave the token in .git/config for build steps
      # rustup is preinstalled on ubuntu runners and honours poc/rust-toolchain.toml
      # (channel 1.95.0 + clippy/rustfmt components + the musl target). No toolchain
      # action needed — one fewer third-party dependency to trust.
      - name: Materialize pinned toolchain
        run: rustup show
      # PCR0 input guard: the enclave's dependency closure from Cargo.lock must be
      # the one the published measurement was taken against. Pure Python, no
      # nitro-cli, runs in seconds. A red here means "re-measure before merging".
      - name: Enclave closure guard — self-test (stdlib unittest, no deps)
        run: python3 -m unittest scripts/test_enclave_closure_check.py
      - name: Enclave dependency closure matches the measured snapshot
        run: python3 scripts/enclave-closure-check.py
      # ROT-8 stdin secret parser. The kmstool binary cannot be executed on a
      # normal host — `aws_nitro_enclaves_library_init` aborts outside an enclave
      # — so without this the parser would ship having never run anywhere, which
      # is exactly the "unverified path in vendored C" risk that deferred ROT-8
      # once already. The test compiles `vendor/kmstool-enclave-cli/secrets_stdin.h`
      # standalone (plain C, no SDK types) and drives it; ubuntu-latest has cc.
      - name: Vendored kmstool stdin parser (fail-closed cases)
        run: python3 scripts/test_secrets_stdin.py
      - name: Build (locked)
        run: cargo build --workspace --locked
      # Clippy is split because the enclave crate is PCR0-frozen (see header).
      # Strict `-D warnings` on the crates we CAN edit; warn-only on signer-enclave,
      # whose source cannot be touched to clear dead_code without rebuilding the
      # attested binary and rotating the published PCR0 (the current production
      # measurement is named in the repo README). Rationale +
      # the exact frozen items are documented in the OSTIF feedback doc.
      - name: Clippy — mutable crates (deny warnings)
        run: cargo clippy --workspace --exclude signer-enclave --all-targets --locked -- -D warnings
      - name: Clippy — enclave (warn-only, PCR0-frozen source)
        run: cargo clippy -p signer-enclave --all-targets --locked
      - name: Test
        # --test-threads=1: the auth/config test suite sets and reads process
        # environment variables (SIGNER_REQUIRE_AUTH / ALLOW_NO_AUTH / API_TOKENS)
        # to prove fail-closed invariants. Those tests serialize env access with a
        # per-binary mutex, which does NOT protect against cargo's cross-binary
        # parallel harness — so the suite must run single-threaded to be
        # deterministic. Verified: clean-env single-threaded = 550 passed / 0 failed.
        #
        # This is the honest interim. The idiomatic fix (annotate only the
        # env-dependent tests with serial_test's `#[serial]` and let the rest run
        # parallel) is a change to gateway *source* + a new dependency, so it is
        # tracked as a follow-up for the Signer core lane, not bundled into this
        # CI-hardening PR. Suite runtime today is ~2s, so serialization is not yet
        # a practical bottleneck.
        run: cargo test --workspace --locked -- --test-threads=1

  audit:
    # Dependency-CVE gate. cargo-audit scans poc/Cargo.lock against the RustSec
    # advisory DB and reads poc/.cargo/audit.toml (project-local config) for the
    # justified ignore-list. Each ignore is a reachability decision. Remediation is
    # NOT uniform: a bump that TOUCHES THE ATTESTED PATH needs PCR0 analysis (it changes
    # the measured enclave), whereas a host-side / lockfile-only fix IS applicable as
    # long as it does not change the measured image.
    # Per-advisory analysis (attested vs host-side vs lockfile-only) is in the OSTIF
    # feedback doc. Installed as a PREBUILT binary (no per-run source compile) via
    # taiki-e/install-action — the one added action is SHA-pinned and Dependabot-
    # tracked, which is a better trade than compiling cargo-audit on every run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cargo-audit (prebuilt)
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2
        with:
          tool: cargo-audit
      - name: cargo audit
        run: cargo audit --deny warnings
