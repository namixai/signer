[package]
name = "signer-enclave"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
hmac.workspace = true
sha2.workspace = true
subtle.workspace = true
zeroize.workspace = true
base64.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
thiserror.workspace = true
hex.workspace = true

# Phase 1 Stage 2 — EIP-712 signing (Hyperliquid family).
# k256: secp256k1 ECDSA (RustCrypto, audited, no_std-compat). We pull
#   only the `ecdsa` feature; no async, no network, no recovery (we
#   compute v ourselves from the bit Ethereum-style).
# tiny-keccak: keccak256 hashing (~300 LoC, no_std). We avoid
#   `sha3` because it pulls in larger generic infrastructure.
# rmp-serde: msgpack encoding for Hyperliquid actionHash assembly.
k256.workspace = true
tiny-keccak.workspace = true
rmp-serde.workspace = true
aes-gcm.workspace = true
rand.workspace = true
# Phase 0 Active Denial — TOFU policy signing.
ed25519-dalek.workspace = true
# Phase 3 will add: aws-nitro-enclaves-nsm-api, reqwest, aws-sigv4, webpki-roots, rsa, cms

[dev-dependencies]
rand = { version = "0.8", features = ["std_rng"] }

# vsock is Linux-only; gate the dep so darwin / windows hosts can still
# run `cargo fmt / clippy / test` against the cross-platform parts
# (signer.rs HMAC tests, handler.rs unit tests, proto.rs serde tests).
# The NSM driver (aws-nitro-enclaves-nsm-api) is likewise Linux-only — it
# ioctls /dev/nsm, which exists ONLY inside a running Nitro enclave. Gated the
# same way; `attestation.rs` carries a non-linux stub so the crate still builds
# and tests on darwin. serde_bytes supplies the `ByteBuf` the NSM `Request`
# fields require (only referenced on the linux path).
[target.'cfg(target_os = "linux")'.dependencies]
tokio-vsock.workspace = true
aws-nitro-enclaves-nsm-api.workspace = true
serde_bytes.workspace = true

[[bin]]
name = "signer-enclave"
path = "src/main.rs"
