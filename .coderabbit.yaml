# CodeRabbit configuration — namixai/signer (публичный репозиторий)
#
# ПОЧЕМУ ЭТОТ ФАЙЛ ПОЯВИЛСЯ (CTO 2026-08-12). В двух других наших репозиториях
# такой конфиг стоит с 29.07 — там уже выяснили, что бот без него ревьюит ВСЁ,
# включая чистый markdown и lock-файлы, и квота кончается ровно тогда, когда
# нужна на money-path. Сюда правку тогда не перенесли, и сегодня это стоило
# лимита: он выбит на PR #35 — двух файлах, `README.md` и `DEMO.md`.
#
# Замер того же дня, шесть остальных открытых PR здесь — dependabot с диффом в
# один `poc/Cargo.lock`. То есть весь текущий поток ревью в этом репозитории
# состоял из двух классов, которые ревьюировать нечем и незачем.
#
# Мы не упирались в лимит — мы его разбазаривали. Второй раз тем же способом.
#
# РАЗДЕЛЕНИЕ РОЛЕЙ (наблюдение, не теория): Gemini берёт структуру, конфиги и
# безопасность; CodeRabbit — тесты, доки и согласованность утверждений. Здесь
# вторая роль ценнее первой: этот репозиторий публичный, и по нему посторонний
# проверяет наши клеймы. Именно CodeRabbit поймал на #34 переоценку гарантии
# ончейн-реестра — что `registerPCR0` безразрешительная, а getter читает
# изменяемое состояние. Пропусти мы это, наружу уехало бы «реестр нельзя
# переписать», и первый же грамотный читатель поймал бы нас на неправде.
#
# ⚠️ Поэтому исключения ниже — про ФОРМАТ (машинный дифф, вендоренное), а НЕ про
# «доки не важны». Документы в `docs/` ревьюим намеренно: `VERIFY-SIGNER-YOURSELF.md`
# это инструкция, по которой посторонний проверяет продукт, и ошибка в ней стоит
# дороже ошибки в коде. Исключён только markdown в корне (README/DEMO/CHANGELOG),
# где правки обычно редакционные.

reviews:
  profile: assertive
  path_filters:
    # Вендоренное и сгенерированное — читать нечего, квоту жжёт заметно.
    - "!poc/vendor/**"
    - "!**/target/**"
    - "!**/__pycache__/**"
    # Зависимости пакетных менеджеров. Замер 2026-08-12: в дереве их СЕЙЧАС НЕТ
    # (0 путей под lib/ и node_modules/, .gitmodules отсутствует, Foundry тянет
    # через remappings.txt и .gitignore). То есть эти две строки сегодня не
    # экономят ничего — это страховка на первый `forge install` или `npm i`,
    # который закоммитят. Помечено прямо, чтобы через месяц никто не принял
    # мёртвый фильтр за наблюдавшуюся трату. (Gemini, #36.)
    - "!**/lib/**"
    - "!**/node_modules/**"
    # Lock-файлы: диффы машинные и огромные. Именно они — шесть из семи текущих
    # открытых PR здесь (dependabot). Безопасность зависимостей стережёт
    # `cargo audit` в CI, а не текстовое ревью машинного файла.
    - "!**/Cargo.lock"
    - "!**/package-lock.json"
    # Корневой markdown. `docs/**` НЕ исключён сознательно — см. врезку выше.
    - "!README.md"
    - "!DEMO.md"
    - "!CHANGELOG.md"
